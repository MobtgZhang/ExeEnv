[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cure-audit"
version = "1.0.0"
description = "Offline execution audit of scientific question answering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib==3.11.2", "numpy==2.5.3"]

[tool.setuptools.packages.find]
where = ["src"]
